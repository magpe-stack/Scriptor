<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="theme-color" content="#257d0d">
</head>
<body>
  <!-- Header / Topo -->
  <header class="app-header">
    <div class="brand">
      <img src="logo.svg" alt="Scriptor Logo" class="brand-logo">
      <span class="brand-name">Scriptor</span>
    </div>
  </header>

  <div class="app-container">
    <!-- Barra de Menu Lateral -->
    <nav class="sidebar" aria-label="Menu Principal">
      <div class="nav-group top-nav">
        <!-- 1. Novo -->
        <button class="nav-btn" id="btn-new" title="Novo" aria-label="Novo">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        </button>

        <!-- 2. Exportar -->
        <button class="nav-btn" id="btn-export" title="Exportar" aria-label="Exportar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </button>

        <!-- 3. Carregar -->
        <button class="nav-btn" id="btn-import" title="Carregar" aria-label="Carregar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>

        <div class="nav-divider"></div>

        <!-- 4. Painel -->
        <button class="nav-btn active" id="btn-dashboard" title="Painel" aria-label="Painel">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>

        <!-- 5. Fase 1 - Fundação -->
        <button class="nav-btn" id="btn-fase1" title="Fase 1 - Fundação" aria-label="Fase 1 - Fundação">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        </button>

        <!-- 6. Fase 2 - Psique do Protagonista -->
        <button class="nav-btn" id="btn-fase2" title="Fase 2 - Psique do Protagonista" aria-label="Fase 2 - Psique do Protagonista">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>

        <!-- 7. Fase 3 - Enredo Causal e Terceiro Trilho -->
        <button class="nav-btn" id="btn-fase3" title="Fase 3 - Enredo Causal e Terceiro Trilho" aria-label="Fase 3 - Enredo Causal e Terceiro Trilho">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </button>

        <!-- 8. Fase 4 - Cartões de Cena -->
        <button class="nav-btn" id="btn-fase4" title="Fase 4 - Cartões de Cena" aria-label="Fase 4 - Cartões de Cena">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        </button>

        <!-- 9. Fase 5 - Roteiro (Roadmap) -->
        <button class="nav-btn" id="btn-fase5" title="Fase 5 - Roteiro (Roadmap)" aria-label="Fase 5 - Roteiro (Roadmap)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        </button>

        <!-- 10. Editor de Rascunho -->
        <button class="nav-btn" id="btn-editor" title="Editor de Rascunho" aria-label="Editor de Rascunho">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </button>
      </div>

      <!-- 11. Botão de Modo Claro/Escuro (Parte inferior) -->
      <div class="nav-group bottom-nav">
        <button class="nav-btn" id="btn-theme-toggle" title="Alternar Modo Claro/Escuro" aria-label="Alternar Modo Claro/Escuro">
          <svg class="icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg class="icon theme-icon-light hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>

      <!-- Submenu Nível 2 - Exportar -->
      <div class="flyout-menu" id="flyout-export">
        <div class="flyout-header">Exportar</div>
        <button class="flyout-btn" id="btn-exp-json" title="Exportar JSON" aria-label="Exportar JSON">
          <span class="badge">JSON</span>
        </button>
        <button class="flyout-btn" id="btn-exp-md" title="Exportar MD" aria-label="Exportar MD">
          <span class="badge">MD</span>
        </button>
        <button class="flyout-btn" id="btn-exp-txt" title="Exportar TXT" aria-label="Exportar TXT">
          <span class="badge">TXT</span>
        </button>
        <button class="flyout-btn" id="btn-exp-docx" title="Exportar DOCX" aria-label="Exportar DOCX">
          <span class="badge">DOCX</span>
        </button>
      </div>

      <!-- Submenu Nível 2 - Carregar -->
      <div class="flyout-menu" id="flyout-import">
        <div class="flyout-header">Carregar</div>
        <button class="flyout-btn" id="btn-imp-json" title="Carregar JSON" aria-label="Carregar JSON">
          <span class="badge">JSON</span>
        </button>
      </div>
    </nav>

    <!-- Área Principal de Conteúdo -->
    <main class="main-content" id="content-area">
      <div class="welcome-card">
        <h1 id="view-title">Painel</h1>
        <p id="view-desc">Bem-vindo ao Scriptor. Selecione uma opção no menu lateral para começar.</p>
      </div>
    </main>
  </div>

  <input type="file" id="file-input-json" accept=".json" style="display: none;">
  <script src="app.js"></script>
</body>
</html>
