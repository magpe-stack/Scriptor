<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptor - Planejamento Literário</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#257d0d">
  
  <!-- Estilos para a Barra Superior Direita (Idioma e Tema) -->
  <style>
    #top-right-toolbar {
      position: fixed;
      top: 14px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10000;
    }

    .goog-te-combo {
      background-color: var(--card-bg, #1e1e1e) !important;
      color: var(--text-color, #ffffff) !important;
      border: 1px solid var(--border-color, #333333) !important;
      padding: 6px 10px !important;
      border-radius: 8px !important;
      font-size: 0.85rem !important;
      outline: none !important;
      cursor: pointer !important;
    }

    .goog-te-gadget {
      font-size: 0 !important;
      color: transparent !important;
    }

    .goog-te-gadget span {
      display: none !important;
    }

    /* Oculta a barra de aviso que o Google injeta no topo da página */
    body > .skiptranslate, .goog-te-banner-frame {
      display: none !important;
    }

    body {
      top: 0px !important;
    }
  </style>
</head>
<body>

  <!-- Barra Superior Direita: Idioma e Tema -->
  <div id="top-right-toolbar">
    <!-- Seletor do Google Translate -->
    <div id="google_translate_element"></div>

    <!-- Botão do Modo Claro / Escuro -->
    <button id="theme-toggle" class="icon-btn" title="Alternar Modo Claro / Escuro" style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--border-color); cursor: pointer;">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: var(--text-color);">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
      </svg>
    </button>
  </div>

  <div class="app-container">
    
    <!-- Sidebar / Menu Lateral Persistente -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        </div>
        <span class="brand-name">Scriptor</span>
      </div>

      <nav class="sidebar-nav">
        <ul>
          <!-- Ação: Novo / Configurar Projeto -->
          <li>
            <button class="icon-btn" data-action="new" title="Novo / Configurar Projeto">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
          </li>

          <!-- Submenu de Exportação/Importação -->
          <li class="menu-item has-submenu">
            <button class="icon-btn toggle-submenu" title="Exportar / Importar Projeto">
              <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
            <ul class="submenu">
              <li>
                <button class="icon-btn submenu-btn" data-export="json" title="Exportar Projeto em JSON">
                  <span class="btn-text">JSON</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-export="md" title="Exportar para Markdown">
                  <span class="btn-text">MD</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-export="txt" title="Exportar para Texto">
                  <span class="btn-text">TXT</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-export="docx" id="export-docx-btn" title="Exportar para Word (.docx)">
                  <span class="btn-text">DOCX</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-import="json" title="Importar Projeto JSON">
                  <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                </button>
              </li>
            </ul>
          </li>

          <!-- Módulo Teórico -->
          <li class="menu-item has-submenu">
            <button class="icon-btn toggle-submenu" title="Módulo Teórico">
              <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
            </button>
            <ul class="submenu">
              <li>
                <button class="icon-btn submenu-btn" data-route="theory-pt" title="Introdução Teórica">
                  <span class="btn-text">PT</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-route="theory-storygenius" title="O Método Story Genius">
                  <span class="btn-text">SG</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-route="theory-steps" title="Passo a Passo do Planejamento">
                  <span class="btn-text">PA</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-route="theory-example" title="Exemplo Prático">
                  <span class="btn-text">EX</span>
                </button>
              </li>
              <li>
                <button class="icon-btn submenu-btn" data-route="theory-tips" title="Dicas de Redação">
                  <span class="btn-text">DC</span>
                </button>
              </li>
            </ul>
          </li>

          <!-- Rota: Painel de Progresso / Métricas -->
          <li>
            <button class="icon-btn" data-route="dashboard" title="Painel de Progresso e Métricas">
              <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            </button>
          </li>

          <!-- Rotas Práticas das Fases -->
          <li>
            <button class="icon-btn" data-route="phase1" title="Fase 1: Fundação">
              <span class="btn-text">F1</span>
            </button>
          </li>
          <li>
            <button class="icon-btn" data-route="phase2" title="Fase 2: Psique do Protagonista">
              <span class="btn-text">F2</span>
            </button>
          </li>
          <li>
            <button class="icon-btn" data-route="phase3" title="Fase 3: Enredo Causal">
              <span class="btn-text">F3</span>
            </button>
          </li>
          <li>
            <button class="icon-btn" data-route="phase4" title="Fase 4: Cartões de Cena">
              <span class="btn-text">F4</span>
            </button>
          </li>
          <li>
            <button class="icon-btn" data-route="phase5" title="Fase 5: Roteiro (Roadmap)">
              <span class="btn-text">F5</span>
            </button>
          </li>

          <!-- Rota: Editor de Rascunho -->
          <li>
            <button class="icon-btn" data-route="editor" title="Editor de Rascunho">
              <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Área de Conteúdo Principal Dinâmica -->
    <main class="main-content">
      <section id="app-view" class="welcome-container">
        <div class="welcome-overlay">
          <h2>Bem-vindo ao Scriptor</h2>
          <p>Selecione uma opção no menu lateral para começar.</p>
        </div>
        <img src="ilustra-scriptor.svg" alt="Ilustração de boas-vindas do Scriptor" class="welcome-illustration">
      </section>
    </main>
  </div>

  <!-- Script de Inicialização do Google Translate -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'pt',
        includedLanguages: 'en,es,fr,it,de,pt',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- Scripts dos Módulos Teóricos, Formulários das Fases, Editor e Suporte -->
  <script src="theory-pt.js"></script>
  <script src="theory-storygenius.js"></script>
  <script src="theory-steps.js"></script>
  <script src="theory-example.js"></script>
  <script src="theory-tips.js"></script>
  <script src="form-phase1.js"></script>
  <script src="form-phase2.js"></script>
  <script src="form-phase3.js"></script>
  <script src="form-phase4.js"></script>
  <script src="form-phase5.js"></script>
  <script src="editor.js"></script>
  <script src="dashboard.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
